[package]
name = "rust-rag-orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "100% Rust RAG & GraphRAG Orchestrator for SurrealDB, Hugging Face TEI, and Generic LLMs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
futures-util = "0.3"
text-splitter = { version = "0.18", features = ["markdown"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
dotenvy = "0.15"
pdf-extract = "0.7"
html2text = "0.12"

