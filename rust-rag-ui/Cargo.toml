[package]
name = "rust-rag-ui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "100% Rust WebAssembly (Leptos) Chat & Knowledge Management UI for SurrealDB RAG"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
futures = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlInputElement",
    "FileList",
    "File",
    "Blob",
    "FormData",
    "Window",
    "Document",
    "Storage",
    "Response",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "HtmlAnchorElement",
    "Url",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"

